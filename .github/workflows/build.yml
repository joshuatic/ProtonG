name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ubuntu:
    name: Ubuntu Latest GCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            build-essential \
            cmake \
            libvulkan-dev \
            vulkan-tools \
            glslang-tools \
            libwayland-dev \
            libxkbcommon-dev \
            xorg-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Verify Vulkan tools
        shell: bash
        run: |
          which glslangValidator
          which vulkaninfo || true

      - name: Configure CMake
        shell: bash
        run: cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build "${{ github.workspace }}/build" --parallel

  windows:
    name: Windows Latest MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress

          $sdkRoot = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $sdkRoot) {
            throw "Vulkan SDK was not found after Chocolatey installation."
          }

          $vulkanSdk = $sdkRoot.FullName

          "VULKAN_SDK=$vulkanSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$vulkanSdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "Using Vulkan SDK: $vulkanSdk"

      - name: Verify Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"

          if (-not (Test-Path "$env:VULKAN_SDK\Include\vulkan\vulkan.h")) {
            throw "Missing Vulkan header: $env:VULKAN_SDK\Include\vulkan\vulkan.h"
          }

          if (-not (Test-Path "$env:VULKAN_SDK\Lib\vulkan-1.lib")) {
            throw "Missing Vulkan library: $env:VULKAN_SDK\Lib\vulkan-1.lib"
          }

          where.exe glslangValidator

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S "${{ github.workspace }}" `
            -B "${{ github.workspace }}/build" `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build
        shell: pwsh
        run: cmake --build "${{ github.workspace }}/build" --config Release --parallel

  macos:
    name: macOS Latest Clang
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            vulkan-loader \
            vulkan-headers \
            vulkan-tools \
            glslang \
            molten-vk

      - name: Configure Vulkan environment
        shell: bash
        run: |
          echo "VULKAN_SDK=$(brew --prefix)" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Verify Vulkan tools
        shell: bash
        run: |
          which glslangValidator
          which vulkaninfo || true
          test -f "$(brew --prefix)/include/vulkan/vulkan.h"

      - name: Configure CMake
        shell: bash
        run: cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build "${{ github.workspace }}/build" --parallel