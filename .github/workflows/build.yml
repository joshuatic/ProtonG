name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Ubuntu Latest GCC
            os: ubuntu-latest
            build_type: Release
            generator: Ninja
            cc: gcc
            cxx: g++

          - name: Windows Latest MSVC
            os: windows-latest
            build_type: Release
            generator: Ninja
            cc: cl
            cxx: cl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libvulkan-dev \
            vulkan-tools \
            glslang-tools \
            libwayland-dev \
            libxkbcommon-dev \
            xorg-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja vulkan-sdk -y

      - name: Configure CMake
        run: cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build" -G "${{ matrix.config.generator }}" -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DCMAKE_C_COMPILER=${{ matrix.config.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }}

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --config ${{ matrix.config.build_type }} --parallel